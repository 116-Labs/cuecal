name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run ruff check .
      - run: uv run pytest

  # Stable required-check name whatever the matrix holds. `always()` keeps a
  # failed or cancelled leg from turning this job into a skipped, passing check.
  test:
    if: always()
    needs: test-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.test-matrix.result }}
        run: test "$RESULT" = success

  # Static audit of the workflows themselves: the repo is public, so an
  # unpinned action or an over-broad token is a real exposure. Fails on any
  # finding. A by-design exception is suppressed inline, at the line, with its
  # reason (`# zizmor: ignore[<audit>]`), never in a global config.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Online audits (impostor commits, known-vulnerable actions) query the API.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fail the job on findings instead of uploading SARIF to code scanning.
          advanced-security: false
          inputs: .github
          collect: all
          # Pinned so a new zizmor audit lands in a PR that bumps this, not as a
          # surprise red on an unrelated one.
          version: 1.30.1
