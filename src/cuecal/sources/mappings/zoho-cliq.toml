name = "zoho-cliq"
transport = "sse"
url = "https://mcp.zoho.com/sse"
auth_provider = "zoho"
auth_header = "Authorization"
auth_prefix = "Bearer "

list_tool = "list_messages"
# Top-level keys must come before the first [table]; TOML puts later keys inside that table.
items_path = "data.messages"
cursor_path = "data.next_cursor"

[list_args]
query = ""
cursor = "{cursor}"
limit = 50

[field_mapping]
id = "message_id"
sender = "sender.email"
ts = "created_time"
text = "content"
permalink = "message_url"
