# Gaal project profile. Edit freely: `gaal onboard` keeps your values on re-runs.
# Schema: https://github.com/116-Labs/gaal/blob/main/schemas/project.schema.json
schema_version: 1
repo: 116-Labs/cuecal
default_branch: main
visibility: public
tracker:
  kind: github
gates:
  - name: lint
    command: uv run ruff check .
    required: true
  - name: test
    command: uv run pytest
    required: true
preflight: []
install:
  - name: uv
    command: uv sync --locked
commits:
  single_commit: true
  attribution: none
  convention: conventional
branches:
  prefix: gaal/
merge:
  queue: false
  method: squash
  message_source: commits
  auto: true
review:
  required_approvals: 1
  threads_block_merge: true
  reviewers: []
  start_signal: reaction
  identity:
    reviewer: separate
    login: 116-labs-gaal-review[bot]
  dismiss_stale_approvals: true
  require_last_push_approval: false
  code_owner_reviews: true
  required_checks:
    - test
    - zizmor
limits:
  implement_attempts: 3
  revise_rounds: 3
  review_rounds: 2
comms:
  github_comments: true
  maintainer_channels: []
harnesses:
  - claude-code
  - codex
  - antigravity
identities:
  push:
    - 116-labs-gaal-push[bot]
  review:
    - 116-labs-gaal-review[bot]
okfmem:
  enabled: false
