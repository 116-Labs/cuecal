[project]
name = "cuecal"
version = "0.1.0"
description = "Local-first agent that turns meeting invites in chat and email into calendar events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25",
    "platformdirs>=4",
]

[project.scripts]
cuecal = "cuecal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuecal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
