[project]
name = "cuecal"
version = "0.1.0"
description = "Local-first agent that finds meeting invites in chat and email and puts them on your calendar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "icalendar>=6",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "keyring>=25",
    "platformdirs>=4",
    "mcp>=1.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
cuecal = "cuecal.cli:main"

[project.entry-points."cuecal.sources"]
gmail = "cuecal.sources.gmail:GmailSource"

[project.entry-points."cuecal.sinks"]
google-calendar = "cuecal.sinks.google:GoogleCalendarSink"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuecal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
